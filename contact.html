<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact — PayZen Wallet</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="navbar">
  <div class="container nav-container">
    <img src="images/logo.svg" alt="PayZen Wallet" class="logo"/>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="features.html">Features</a></li>
        <li><a href="about.html">About</a></li>
        <li><a class="active" href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<section class="section">
  <div class="container">
    <h2>Contact us</h2>
    <p class="sub">Questions about security, pricing, or onboarding? We’re here to help.</p>

    <form class="form" onsubmit="event.preventDefault(); alert('Thanks! We will reply shortly.');">
      <input class="input" type="text" name="name" placeholder="Your name" required/>
      <input class="input" type="email" name="email" placeholder="Email address" required/>
      <textarea name="message" placeholder="How can we help?" required></textarea>
      <button class="btn btn-primary" type="submit">Send message</button>
    </form>
  </div>
</section>

<footer class="footer">
  <div class="container footer-bottom">
    <span>© 2025 PayZen Wallet</span>
    <span><a href="#" style="color:inherit; text-decoration:none">Privacy Policy</a> · <a href="#" style="color:inherit; text-decoration:none">Terms</a></span>
  </div>
</footer>
</body>
</html>
